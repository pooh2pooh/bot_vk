# Источники бота. Единственное место настройки источников: `.env` для секретов,
# этот файл — для всего остального. Обязательные поля помечены ниже; лишнее
# поле в YAML — ошибка при старте, а не тихая замена настройки.
#
# Все поля описаны в README, раздел «Источники».

sources:
  # ─── linux.org.ru: свежие темы форума ──────────────────────────────────────
  # RSS кладёт в описание только ПЕРВУЮ картинку галереи, остальные стратегия
  # догружает со страницы поста (стратегия `lor`).
  - id: lor
    name: Linux.org.ru
    type: rss
    site: lor
    enabled: true
    url: https://www.linux.org.ru/section-rss.jsp?section=3
    requireImages: true
    # Темы без картинок в ленте новостей теряли бы смысл, но у форума картинка —
    # часть поста, поэтому запись без неё отбрасывается.
    enrich: openrouter
    textMode: generated
    textLimit: 200
    template: templates/forum_post.yml
    # Обёртка запроса задачу не задаёт: она передаёт модели только заголовок,
    # автора и текст поста. Пока задача у LOR и Pingvinus одна и та же —
    # добродушно подколоть автора, — промпт общий. Задачи разойдутся:
    # положите рядом свой .txt и укажите его здесь.
    promptPath: templates/ai_comment.txt
    pollIntervalMs: 300000
    requestTimeoutMs: 30000

  # ─── pingvinus.ru: посты-скриншоты ──────────────────────────────────────────
  # В RSS описание ПУСТОЕ, весь текст на странице поста. `textLimit` здесь —
  # fallback на случай, если OpenRouter не ответил и текст пришлось брать с
  # страницы: длинный пост в чате неуместен, обрезается по границе слова.
  - id: pingvinus
    name: Pingvinus
    type: rss
    site: pingvinus
    enabled: true
    url: https://pingvinus.ru/rss.xml
    requireImages: true
    enrich: openrouter
    textMode: generated
    textLimit: 200
    template: templates/screenshot_post.yml
    promptPath: templates/ai_comment.txt
    pollIntervalMs: 300000
    requestTimeoutMs: 30000

  # ─── manjaro.ru: анонсы обновлений ─────────────────────────────────────────
  # В один Atom-фид свалены анонсы обновлений и обычные новости.
  # `includeFilter` пропускает в ленту только анонсы, а `generateWhen`
  # включает AI — только для них: переводить новости не нужно.
  # Шаблоны regexp обязаны быть в ОДИНАРНЫХ кавычках: в двойных кавычках YAML
  # съедает обратный слэш и `\[` превращается в битый шаблон.
  - id: manjaro
    name: Manjaro Update
    type: rss
    site: none
    enabled: true
    url: https://manjaro.ru/atom
    requireImages: false
    enrich: openrouter
    textMode: feed
    textLimit: 200
    # Анонс — обычный пост форума с заголовком, автором и ссылкой, поэтому
    # шаблон тот же, что у LOR. Свой шаблон заводится рядом и подключается
    # здесь, если понадобится другое оформление.
    template: templates/forum_post.yml
    promptPath: templates/announce_translation.txt
    pollIntervalMs: 600000
    requestTimeoutMs: 30000
    #includeFilter: '^\[(Stable|Testing|Unstable) Update\]'
    generateWhen: '^\[(Stable|Testing|Unstable) Update\]'
